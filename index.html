
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Notes Sharing System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f0f4f8;
            color: #243447;
        }

        header {
            background: #174a7e;
            color: white;
            text-align: center;
            padding: 25px;
        }

        main {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #00000012;
        }

        input, select, button {
            padding: 12px;
            margin-top: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background: #174a7e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Students Notes Sharing System</h1>
        <p>Share Notes • Learn Together • Succeed Together</p>
    </header>

    <main>
        <section class="card">
            <h2>Search Study Notes</h2>
            <input type="text" placeholder="Enter subject name">

            <select>
                <option>Select Semester</option>
                <option>1st Semester</option>
                <option>2nd Semester</option>
                <option>3rd Semester</option>
                <option>4th Semester</option>
                <option>5th Semester</option>
                <option>6th Semester</option>
                <option>7th Semester</option>
                <option>8th Semester</option>
            </select>

            <button>Search Notes</button>
        </section>

        <section class="card">
            <h2>Welcome, Students!</h2>
            <p>This website will help students share and access study notes easily.</p>
            <p>More features, including uploading and downloading notes, will be added next.</p>
        </section>
    </main>

</body>
</html>
